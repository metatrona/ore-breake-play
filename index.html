};

};

 }
}

const setBase=id=>items[id]?.base??id;
function setCount(key){return Object.values(equipped).filter(id=>items[id]?.set===key).length}

function hpCap(){return dayRules.max+(setActive('ward',2)?20:0)}
let strikeCount=0,wardCooldown=0,gemRuns=0,drillRuns=0;
function weaponHit(rock,center,radius,id){
 if(rock===center)return true;
 if(!radius)return false;
 if(id==='obsidian'){
  const dx=center.x-player.x,dy=center.y-player.y,length=Math.hypot(dx,dy)||1;
  const x=rock.x-player.x,y=rock.y-player.y;
  return (x*dx+y*dy)/length>=0&&(x*dx+y*dy)/length<=64&&Math.abs(x*dy-y*dx)/length<=9;
 }
 if(dist(rock,center)>radius)return false;
 if(id==='steel'){
  const a={x:center.x-player.x,y:center.y-player.y};
  return (rock.x-player.x)*a.x+(rock.y-player.y)*a.y>=0;
 }
 return true;
}
function gearPulse(center,id,critical){
 if(id==='sapphire'&&rocks.length){
  const target=rocks.filter(rock=>rock!==center&&rock.hp>0&&dist(rock,center)<43).sort((a,b)=>dist(a,center)-dist(b,center))[0];
  if(target)echoes.push({x:target.x,y:target.y,wait:.14,radius:14,damage:2,color:'#a0dcff',weapon:true});
 }
 if(id==='ruby')echoes.push({x:center.x,y:center.y,wait:.16,radius:30,damage:2,color:'#ff925f',weapon:true});
 if(critical)echoes.push({x:center.x,y:center.y,wait:.11,radius:37,damage:3,color:'#e4fff6',weapon:true});
 if(setActive('blast',4)&&strikeCount%5===0)echoes.push({x:center.x,y:center.y,wait:.12,radius:40,damage:3,color:'#ffb27b',weapon:true});
 else if(setActive('blast',2)&&strikeCount%4===0)echoes.push({x:center.x,y:center.y,wait:.12,radius:20,damage:1,color:'#ff9b63',weapon:true});
}

];

 shape.forEach((row,dy)=>[...row].forEach((mark,dx)=>{

 }));

const strideFrames=[0,1,1.5,.5,-.5,-1];

const strikeFrames=[-2.2,-1.9,-1.1,-.15,.57,.85];
function drawMiner(context,x,y,dir,walk,hit,look=character,pose={}){

 const id=look==='female'?'lucia':'miner';
 if(!artReady(id)){drawFallbackMiner(context,x,y,dir,walk,hit);return}
 context.save();context.translate(Math.round(x*2)/2,Math.round(y*2)/2);context.scale(dir,1);
 context.imageSmoothingEnabled=false;
 const p=(...args)=>pixel(context,...args);
 const miner=artImages[id], height=35, width=height*miner.naturalWidth/miner.naturalHeight;
 const step=Math.floor(walk*14)%strideFrames.length;
 const stride=pose.walking?strideFrames[step]:0;
 const bob=pose.walking?(step%3===0?-.5:0):idleFrames[Math.floor((pose.age??0)*3)%idleFrames.length];
 const hurt=pose.hurt>0?Math.min(2,Math.floor((.24-pose.hurt)*13)):null;
 if(hurt!==null){context.translate([1.5,1,.5][hurt],0);context.rotate([-.13,-.08,0][hurt])}
 p(-8.5,8.5,17,2,'#211922');p(-6,10,12,1,'#1b161e');
 const sprite=image=>{
  const sourceHeight=image.naturalHeight, sourceWidth=image.naturalWidth;
  const split=Math.round(sourceHeight*.70), upper=height*split/sourceHeight, origin=8-height+bob;
  if(!stride){context.drawImage(image,-width/2,origin,width,height);return}
  context.drawImage(image,0,0,sourceWidth,split,-width/2,origin,width,upper);
  const half=Math.floor(sourceWidth/2), leftWidth=width*half/sourceWidth, lower=height-upper;
  context.drawImage(image,0,split,half,sourceHeight-split,-width/2,origin+upper,leftWidth,lower+stride*.6);
  context.drawImage(image,half,split,sourceWidth-half,sourceHeight-split,-width/2+leftWidth,origin+upper,width-leftWidth,lower-stride*.6);
 };
 sprite(miner);
 for(const item of [equipped.top,equipped.legs]){

  if(artReady(art))sprite(artImages[art]);
 }
 if(pose.rest){context.restore();return}
 const hat=appearance[setBase(equipped.hat)];
 if(hat){
  p(-7,-25+bob,14,2,'#392831');p(-5.5,-28+bob,10.5,3,hat.metal);
  p(-4.5,-27.5+bob,8,1,hat.lit);p(-7,-25+bob,14.5,1,hat.trim);
  p(2,-26+bob,3,2,'#fff1b8');
  const spec=sets[items[equipped.hat]?.set];
  if(spec){p(-5,-28+bob,2,1,spec.color);p(4,-25+bob,3,1,spec.color)}
 }
 const topSet=sets[items[equipped.top]?.set], legsSet=sets[items[equipped.legs]?.set];
 if(topSet){p(-6.5,-10+bob,2,5,topSet.color);p(-4.5,-4+bob,2,2,topSet.color)}
 if(legsSet){p(-5.5,4+bob,2,2,legsSet.color);p(2,4+bob,2,2,legsSet.color)}
 context.save();context.translate(look==='female'?5:5.5,1+bob);context.rotate(hit>0?strikeFrames[Math.min(5,Math.floor((1-hit/.22)*6))]:.68);
 drawWeapon(context,p,weapon());context.restore();
 p(4,0+bob,2.5,2,'#e9a675');p(4.5,bob,1.5,.5,'#ffd19a');
 if(equipped.ring1)p(5,1+bob,1,1,(appearance[equipped.ring1]?.lit??sets[items[equipped.ring1]?.set]?.color??'#ffeeb3'));
 if(equipped.ring2)p(-5,1+bob,1,1,(appearance[equipped.ring2]?.lit??sets[items[equipped.ring2]?.set]?.color??'#ffeeb3'));
 if(hit>0){
  const skin=pickSkins[weapon()];
  p(13,-14,7,1,skin.glow||'#ffe3a1');p(20,-12,4,1.5,skin.edge);p(24,-9,1,4,skin.edge);

   drawRect(point.x-2,point.y-2,trail?3:5,trail?3:5,['#87e8bc','#76d8aa92','#76d8aa61','#76d8aa36'][trail]);
   if(!trail)drawRect(point.x,point.y-2,2,2,'#f0ffe2');
  }
 }
 for(const effect of skillFx){
  g.save();g.globalAlpha=1-effect.age/.32;
  g.strokeStyle=effect.color||'#c8c4ff';g.lineWidth=2;g.beginPath();
  if(effect.kind==='pulse')g.arc(effect.x,effect.y,effect.radius*(.3+.7*effect.age/.32),0,Math.PI*2);
  else effect.points.forEach((point,i)=>{
   if(!i){g.moveTo(point.x,point.y);return}
   const last=effect.points[i-1];
   g.lineTo((last.x+point.x)/2+4,(last.y+point.y)/2-6);
   g.lineTo(point.x,point.y);
  });
  g.stroke();g.restore();
 }
}

let previous=performance.now();
function frame(now){
 const elapsed=Math.max(0,(now-previous)/1000);previous=now;
 const dt=Math.min(elapsed,.05);
 if(document.hidden){requestAnimationFrame(frame);return}
 if(life.summary){sceneAge=Math.min(2,sceneAge+dt);drawDayScene();requestAnimationFrame(frame);return}
 motionAge+=dt;wardCooldown=Math.max(0,wardCooldown-dt);hurtAge=Math.max(0,hurtAge-dt);levelGlow=Math.max(0,levelGlow-dt);
 if(tickLife(elapsed)){requestAnimationFrame(frame);return}
 if(smith)drawSmith(dt);
 if(chestScene)animateChest(dt);
 if(el('gear').open||el('rewards').open||el('quests').open||el('offline-report').open){requestAnimationFrame(frame);return}
 const height=Math.round(W*view.clientHeight/Math.max(1,view.clientWidth));
 if(height!==H){H=height;view.height=H*2}
 g.setTransform(2,0,0,2,0,0);g.imageSmoothingEnabled=false;
 let dx=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
 let dy=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);
 if(stick){dx+=stick.dx/24;dy+=stick.dy/24}
 const length=Math.hypot(dx,dy);
 walking=length>.12;
 if(walking){
  const speed=(wearing('boots')?92:76)*(setActive('novice',2)?1.1:1)*dt/Math.max(1,length);
  player.x=clamp(player.x+dx*speed,10,world-10);player.y=clamp(player.y+dy*speed,16,world-10);
  if(Math.abs(dx)>.15)player.dir=Math.sign(dx);
  player.walk+=dt;
  if(Math.floor(player.walk*2)!==Math.floor((player.walk-dt)*2))exposeVeins();
  movementHudTimer+=dt;
  if(movementHudTimer>=.10){movementHudTimer=0;update()}
 }
 if(wave&&(wave.age+=dt)>=.30)wave=null;
 if(combo&&(combo.age+=dt)>=1)combo=null;
 if(tickBoss(dt)){requestAnimationFrame(frame);return}
 cooldown-=dt;swing=Math.max(0,swing-dt);flash=Math.max(0,flash-dt);
 if(holding||keys.has('Space'))strike();
 drillTimer+=dt;
 if(drill&&drillProducing()&&drillTimer>.85/(1+(drillTier-1)*.30)){drillTimer=0;mine(false)}
 let collected=false;
 loot=loot.filter(gem=>{
  gem.age+=dt;if(gem.age<0)return true;
  if(gem.age<.22){gem.x+=gem.dx*dt;gem.y+=gem.dy*dt;return true}
  const d=dist(player,gem);
  if(d<5){collectGem(gem);collected=true;return false}
  if(d<(wearing('magnet')?125+8*((rank.magnet??1)-1):90)){const step=Math.min(d,dt*(95+gem.age*42));gem.x+=(player.x-gem.x)*step/d;gem.y+=(player.y-gem.y)*step/d}
  return true;
 });
 if(collected)update();
 tickSkills(dt);
 dust=dust.filter(p=>{p.age+=dt;if(p.age>=0){p.x+=p.dx*dt;p.y+=p.dy*dt;p.dy+=155*dt}return p.age<.34});
 saveTimer+=dt;if(saveTimer>4){saveTimer=0;save()}
 render(dt);requestAnimationFrame(frame);
}
exposeVeins();update();
if(clockAdvanced)save();
if(life.summary)showDaySummary();else showOfflineReport();
requestAnimationFrame(frame);
</script></html>
