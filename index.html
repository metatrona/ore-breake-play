const keys=new Set(), clamp=(v,min,max)=>Math.min(max,Math.max(min,v));

function addRock(x,y,type){
 const locked=unlock[type]>1;
 const visibleType=locked?8:type;
 rocks.push({x,y,type:visibleType,hp:ores[visibleType][2],reveal:locked?type:undefined});
}
const shapes=[
 [' kko ','kscok','kccok',' kko '],
 ['cck  ',' cck ','  csc','   kk'],
 ['kkk  ','khrhk','khgsk',' kkk '],
 [' o o ','ooaoo','o g o',' kkk '],
 ['kk kk','kbbbk','kbrbk','kbhbk','kk kk'],
 ['c c s',' c s ',' kas ','  ok ']
];
const types={k:8,o:0,c:1,h:2,s:3,g:4,a:5,b:10,r:7,u:6};
function layVein(x,y,shape,variant){
 shape.forEach((row,dy)=>[...row].forEach((mark,dx)=>{
  if(mark===' ')return;
  const type=mark==='r'&&variant%2===0?6:mark==='k'&&variant%4===3?9:types[mark];
  addRock(x+dx*13+(dy%2)*2,y+dy*13,type);
 }));
}
for(let y=58;y<world-80;y+=92)for(let x=58;x<world-80;x+=92){
 if(Math.hypot(x-750,y-750)<145)continue;
 const variant=((x*37)^(y*53)^(x*y))>>>0;
 layVein(x+variant%17,y+(variant>>5&15),shapes[(variant>>9&127)%shapes.length],variant);
}
for(let i=0;i<11;i++)addRock(774+i%4*13,746+Math.floor(i/4)*13,1);
layVein(665,768,shapes[0],0);
layVein(716,664,shapes[2],3);
layVein(822,803,shapes[3],0);
layVein(862,724,shapes[5],0);
layVein(690,834,shapes[4],1);
const diamondSites=[[496,467],[1084,461],[449,1080],[1111,1079],[765,1250],[758,255]];
function addDiamondSites(){diamondSites.forEach(([x,y])=>[[0,0],[13,1],[6,13]].forEach(([dx,dy])=>addRock(x+dx,y+dy,11)))}
addDiamondSites();
const scenery=[
 {x:736,y:728,kind:'lamp'},{x:758,y:785,kind:'cart'},{x:704,y:740,kind:'beam'},
 {x:812,y:702,kind:'lamp'},{x:858,y:788,kind:'beam'},{x:680,y:824,kind:'lamp'}
];
for(let y=96;y<world-70;y+=146)for(let x=82;x<world-70;x+=151){
 if(Math.hypot(x-750,y-750)<145)continue;
 const hash=((x*31)^(y*89)^(x*y))>>>0;
 scenery.push({x:x+hash%39,y:y+(hash>>8&39),kind:['lamp','cart','beam','fungi'][hash>>4&3]});
}
function exposeVeins(){
 const current=level();
 for(const rock of rocks){
  if(rock.reveal===undefined||rock.hp!==ores[rock.type][2]||unlock[rock.reveal]>current||dist(player,rock)<110)continue;
  rock.type=rock.reveal;rock.hp=ores[rock.type][2];delete rock.reveal;
 }
}
let idleCount=0;
try{
 const data=JSON.parse(localStorage.getItem(key));
 if(data){
  Object.assign(player,data.player);
  owned=[...new Set(['wood',...(data.owned??[])])];equipped={weapon:'wood',...(data.equipped??{})};reserves={...reserves,...data.reserves};
  ({loot,cash,hunger,drill,freeMeal,spicy,best}=data);
  bag=ores.map((_,index)=>data.bag[index]??0);
  claims=data.claims??[];rank=data.rank??{};chests=data.chests??[];opened=data.opened??[];
  xp=data.xp??0;mined=data.mined??0;bossWins=data.bossWins??0;boss=data.boss??null;
  const seconds=(Date.now()-(data.savedAt??Date.now()))/1000;
  if(drill&&seconds>=60){
   idleCount=Math.min(60,Math.floor(seconds/120));
   for(let i=0;i<idleCount;i++)bag[level()>=4&&i%4===0?2:1]++;
   xp+=idleCount;
  }
  if(data.mapVersion===mapVersion){rocks=data.rocks;if(!data.diamondSites)addDiamondSites()}
 }
}catch{}

 try{localStorage.setItem(key,JSON.stringify({player,rocks,loot,cash,hunger,drill,freeMeal,spicy,bag,best,owned,equipped,xp,mapVersion,reserves,diamondSites:true,mined,bossWins,boss,claims,rank,chests,opened,savedAt:Date.now()}))}catch{}
}

  drawRect(x-12,y+5,24,4,'#211925');drawRect(x-11,y-8,22,14,'#403654');
  drawRect(x-8,y-13,16,16,'#735399');drawRect(x-4,y-17,8,19,'#a079cf');
  drawRect(x-3,y-15,4,5,'#dec2ff');drawRect(x-7,y-4,4,3,'#ffe3a2');drawRect(x+3,y-4,4,3,'#ffe3a2');
  drawRect(x-12,y-22,24,3,'#251e30');drawRect(x-12,y-22,24*boss.hp/boss.max,3,'#ff9f8f');
 }
 if(wave){
  g.save();g.globalAlpha=1-wave.age/.30;g.strokeStyle=wave.color;g.lineWidth=2;
  g.beginPath();g.arc(wave.x,wave.y,wave.radius*(.35+.65*wave.age/.30),0,Math.PI*2);g.stroke();g.restore();
 }
 for(const gem of loot)if(gem.age>=0&&near(gem)){
  drawRect(gem.x-2,gem.y-2,5,5,ores[gem.type][1]);drawRect(gem.x-1,gem.y-2,2,2,'#fff0c8');
 }
 drawPlayer();
 if(drill){
  const x=player.x-player.dir*14,y=player.y+2;
  drawRect(x-5,y-2,10,6,'#9a7660');drawRect(x-5,y+3,8,2,'#271e2b');
  drawRect(x-2,y-4,4,3,'#eabc67');drawRect(x+4,y,3,2,'#d4ced4');
 }
 for(const p of dust)if(p.age>=0)drawRect(p.x,p.y,p.age<.12?3:2,2,p.color);
 if(combo){
  g.save();g.globalAlpha=Math.min(1,(1-combo.age)*2);g.font='bold 10px monospace';g.textAlign='center';
  g.strokeStyle='#261d30';g.lineWidth=3;g.fillStyle='#ffdd91';
  const y=combo.y-18-combo.age*18;
  g.strokeText(combo.text,combo.x,y);g.fillText(combo.text,combo.x,y);g.restore();
 }
 g.restore();
 if(flash>0){g.strokeStyle='rgba(255,209,137,'+flash+')';g.lineWidth=4;g.strokeRect(1,1,W-2,H-2)}
 if(stick){
  const x=stick.x*W/view.clientWidth,y=stick.y*H/view.clientHeight;
  g.strokeStyle='#d9af8580';g.beginPath();g.arc(x,y,16,0,Math.PI*2);g.stroke();
  drawRect(x+clamp(stick.dx/3,-12,12)-3,y+clamp(stick.dy/3,-12,12)-3,6,6,'#d9af85');
 }
}
function beginSmith(id){
 const dialog=el('smith');
 smith={id,age:0,strikes:0};
 el('smith-result').textContent='강철 곡괭이와 보석을 재련하는 중';
 el('smith-close').disabled=true;
 dialog.showModal();
 const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
 drawSmith(reduced?2:0);
}
function hammerSound(){
 try{
  audio??=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume().catch(()=>{});
  const t=audio.currentTime;
  for(const [pitch,volume] of [[164,.09],[515,.045],[1120,.023]]){
   const tone=audio.createOscillator(),gain=audio.createGain();
   tone.type='triangle';tone.frequency.value=pitch;
   gain.gain.setValueAtTime(volume,t);gain.gain.exponentialRampToValueAtTime(.001,t+.18);
   tone.connect(gain);gain.connect(audio.destination);tone.start(t);tone.stop(t+.2);
  }
 }catch{}
}
function drawSmith(dt){
 const scene=el('smith-scene').getContext('2d');
 const p=(...args)=>pixel(scene,...args);
 smith.age+=dt;
 const {id,age}=smith, color=pickSkins[id].glow;
 const times=[.32,.82,1.32], done=age>=1.63;
 const strikeCount=times.filter(time=>time<=age).length;
 if(strikeCount>smith.strikes&&dt<.1)hammerSound();
 smith.strikes=strikeCount;
 p(0,0,128,78,'#211a29');p(0,64,128,14,'#352631');
 p(8,13,25,48,'#523340');p(12,18,17,37,'#301f2b');
 p(15,44,11,9,'#d76849');p(18,41,5,11,'#efae58');p(19,46,3,5,'#ffe094');
 p(44,52,47,7,'#211d28');p(46,47,44,5,'#aeb0bd');p(52,52,26,7,'#766a80');
 p(55,57,17,9,'#514654');p(49,65,29,4,'#817184');
 scene.save();scene.translate(64,done?37:42);scene.rotate(done?.57:1.52);
 drawPick(p,pickSkins[done?id:'steel']);scene.restore();
 if(!done){
  p(66,42,6,5,color);p(67,40,4,7,color);p(67,41,2,2,'#fff6c6');
  const next=times[strikeCount]??1.82;
  const closing=Math.max(0,1-(next-age)/.20);
  scene.save();scene.translate(88,26+closing*14);scene.rotate(-.7+closing*.82);
  p(-1,0,3,19,'#9a674e');p(-8,-4,17,8,'#423348');p(-9,-5,18,4,'#b6a2a7');p(-9,-1,6,5,'#796776');
  scene.restore();
 }
 const impact=age-(times[strikeCount-1]??-1);
 if(!done&&impact<.23)for(let i=0;i<13;i++){
  const angle=Math.PI+(i/12)*Math.PI;
  const radius=5+impact*(42+i*5);
  p(69+Math.cos(angle)*radius,43+Math.sin(angle)*radius,2,2,i%3?color:'#ffdf91');
 }
 if(done){
  el('smith-result').textContent=items[id].name+' 완성 · 착용 완료';
  el('smith-close').disabled=false;
  smith=null;
 }
}
el('smith-close').onclick=()=>el('smith').close();
el('smith').addEventListener('cancel',event=>{if(smith)event.preventDefault()});

const skillRings=['orbit','storm','echo','magnet'];
const pendingReward=()=>milestones.find(mark=>level()>=mark&&!claims.includes(mark));
const chestCovered=chest=>chest.coverX!==undefined&&rocks.some(rock=>rock.x===chest.coverX&&rock.y===chest.coverY);
function nearChest(){
 return chests.concat(hiddenChests).find(chest=>!opened.includes(chest.id)&&dist(player,chest)<27&&!chestCovered(chest));
}
function grantRing(id){
 owned.push(id);
 const slot=['ring1','ring2'].find(slot=>!equipped[slot]);
 if(slot)equipped[slot]=id;
}
function pauseInput(){holding=false;stick=null;keys.clear()}
function rewardButton(label,detail,action){
 const button=document.createElement('button'),name=document.createElement('span'),copy=document.createElement('small');
 name.textContent=label;copy.textContent=detail;button.append(name,copy);
 button.onclick=action;el('reward-options').append(button);
}
function resetRewards(title){
 el('reward-title').textContent=title;
 el('reward-copy').textContent='';
 el('reward-options').replaceChildren();
 el('chest-art').hidden=true;
 el('reward-close').disabled=false;
}
function showLevelChoice(){
 const mark=pendingReward();
 if(!mark||el('rewards').open)return;
 pauseInput();
 resetRewards('광부 Lv. '+mark+' 보상');
 const choose=(label,description,apply)=>rewardButton(label,description,()=>{
  if(pendingReward()!==mark)return;
  apply();claims.push(mark);save();
  el('rewards').close();note(label+' 획득');update();
 });
 if(mark===2&&["orbit","storm"].some(id=>!owned.includes(id))){
  for(const id of ['orbit','storm'].filter(id=>!owned.includes(id)))choose(items[id].name,items[id].description,()=>grantRing(id));
 }else{
  choose('곡괭이 강화','모든 곡괭이의 피해 +1',()=>{rank.weapon=(rank.weapon??0)+1});
  for(const id of skillRings.filter(id=>wearing(id))){
   const details={orbit:'회전 조각과 궤도 범위 증가',storm:'번개가 암석 한 개에 더 튕김',echo:'공명 폭발의 피해와 범위 증가',magnet:'수집 범위 증가, 파동이 더 자주 발동'};
   choose(items[id].name+' 강화',details[id],()=>{rank[id]=(rank[id]??1)+1});
  }
  if(!skillRings.some(id=>wearing(id))){
   const id=skillRings.find(id=>!owned.includes(id));
   if(id)choose(items[id].name,items[id].description,()=>grantRing(id));
  }
 }
 el('rewards').showModal();
}
function openChest(){
 const chest=nearChest();
 if(!chest||el('rewards').open)return;
 pauseInput();resetRewards(chest.tier?'보석 괴물의 보물상자':'낡은 보물상자');
 const ring=chest.tier?['storm','orbit','echo','magnet'].find(id=>!owned.includes(id)):null;
 if(ring)grantRing(ring);
 const count=chest.tier?5:0;
 if(count)bag[chest.gem]+=count;
 const gold=chest.tier?30+10*chest.tier:20;
 cash+=gold;opened.push(chest.id);save();update();
 const result=[ring&&items[ring].name,count&&ores[chest.gem][0]+' '+count+'개',gold+'G'].filter(Boolean).join(' · ');
 chestScene={age:0,result,ring};
 el('chest-art').hidden=false;el('reward-close').disabled=true;
 el('rewards').showModal();
 animateChest(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?1.15:0);
}
function drawChest(context,x,y,opening,blocked=false){
 const p=(dx,dy,w,h,c)=>pixel(context,x+dx,y+dy,w,h,c);
 if(blocked){p(1,-7,7,3,'#d8a35f');p(5,-6,3,6,'#8e663f');return}
 p(-11,4,22,4,'#241c28');p(-10,-3,20,10,'#874b3b');
 p(-9,0,18,5,'#a36144');p(-8,0,2,6,'#e3aa61');p(6,0,2,6,'#e3aa61');
 const lid=Math.round(opening*9);
 p(-10,-8-lid,20,7,'#6c392f');p(-9,-8-lid,18,2,'#db9f56');p(-9,-5-lid,18,2,'#ad764c');
 p(-2,-4,4,5,'#f8d58a');p(0,-3,1,3,'#7e533e');
}
function animateChest(dt){
 const context=el('chest-art').getContext('2d');
 chestScene.age+=dt;
 const age=chestScene.age,opening=clamp((age-.34)/.35,0,1);
 const p=(...args)=>pixel(context,...args);
 p(0,0,112,58,'#221b2a');
 const x=56+(age<.34?Math.round(Math.sin(age*75)*age*6):0);
 if(opening){
  p(42,20,28,21,'#ffcc5833');p(48,15,16,24,'#ffe79466');
  for(let i=0;i<9;i++){
   const angle=i*2.39,range=opening*(12+i*2);
   p(56+Math.cos(angle)*range,35+Math.sin(angle)*range,2,2,'#ffdf87');
  }
  if(chestScene.ring&&opening>.45){p(51,22-opening*8,10,8,'#f2cf82');p(53,23-opening*8,6,5,'#8d6bc1');p(54,22-opening*8,3,2,'#fff6bb')}
 }
 drawChest(context,x,43,opening);
 if(age>=1.1){
  el('reward-copy').textContent=chestScene.result;
  el('reward-close').disabled=false;chestScene=null;
 }
}
el('reward-open').onclick=showLevelChoice;
el('chest-open').onclick=openChest;
el('reward-close').onclick=()=>el('rewards').close();
el('rewards').addEventListener('cancel',event=>{if(chestScene)event.preventDefault()});
function orbitPoints(trail=0){
 const strength=rank.orbit??1;
 return Array.from({length:Math.min(3,strength)},(_,i)=>{
  const angle=orbitTime*2.8+i*2*Math.PI/Math.min(3,strength)-trail;
  const radius=21+strength*4;
  return {x:player.x+Math.cos(angle)*radius,y:player.y+Math.sin(angle)*radius};
 });
}
function skillHit(targets,damage,origin){
 const queue=[],broken=new Set();
 for(const rock of targets){
  rock.hp-=damage;
  if(rock.hp<=0){broken.add(rock);queue.push([rock,0])}
  else sparks(rock,4,0);
 }
 if(queue.length)breakRocks(queue,broken,origin,false,null);
}
function skillPulse(origin,radius,damage,color){
 skillFx.push({kind:'pulse',x:origin.x,y:origin.y,radius,color,age:0});
 skillHit(rocks.filter(rock=>dist(origin,rock)<=radius),damage,origin);
}
function tickSkills(dt){
 orbitTime+=dt;orbitCooldown-=dt;stormTimer-=dt;
 skillFx=skillFx.filter(effect=>(effect.age+=dt)<.32);
 if(wearing('orbit')&&orbitCooldown<=0){
  const points=orbitPoints();
  const targets=rocks.filter(rock=>points.some(point=>dist(point,rock)<8));
  if(targets.length){orbitCooldown=.18;skillHit(targets,1,player)}
 }
 if(wearing('storm')&&stormTimer<=0){
  const candidates=rocks.filter(rock=>dist(rock,player)<63);
  const points=[{x:player.x,y:player.y}],targets=[];
  while(targets.length<1+(rank.storm??1)){
   const from=points.at(-1);
   const next=candidates.find(rock=>!targets.includes(rock)&&dist(rock,from)<35);
   if(!next)break;
   targets.push(next);points.push(next);
  }
  if(targets.length){
   stormTimer=1.7;skillFx.push({kind:'bolt',points,age:0});skillHit(targets,1,points[1]);
  }
 }
 if(wearing('magnet')&&magnetCharge>=Math.max(4,10-(rank.magnet??1)*2)){
  magnetCharge=0;skillPulse(player,28+(rank.magnet??1)*3,1,'#7de0d9');
 }
 const ready=echoes.filter(echo=>(echo.wait-=dt)<=0);
 echoes=echoes.filter(echo=>echo.wait>0);
 if(wearing('echo'))for(const echo of ready)skillPulse(echo,echo.radius,echo.damage,'#d1a0ff');
}
function drawSkills(){
 if(wearing('orbit')){
  for(let trail=3;trail>=0;trail--)for(const point of orbitPoints(trail*.15)){
   drawRect(point.x-2,point.y-2,trail?3:5,trail?3:5,['#87e8bc','#76d8aa92','#76d8aa61','#76d8aa36'][trail]);
   if(!trail)drawRect(point.x,point.y-2,2,2,'#f0ffe2');
  }
 }
 for(const effect of skillFx){
  g.save();g.globalAlpha=1-effect.age/.32;
  g.strokeStyle=effect.color||'#c8c4ff';g.lineWidth=2;g.beginPath();
  if(effect.kind==='pulse')g.arc(effect.x,effect.y,effect.radius*(.3+.7*effect.age/.32),0,Math.PI*2);
  else effect.points.forEach((point,i)=>{
   if(!i){g.moveTo(point.x,point.y);return}
   const last=effect.points[i-1];
   g.lineTo((last.x+point.x)/2+4,(last.y+point.y)/2-6);
   g.lineTo(point.x,point.y);
  });
  g.stroke();g.restore();
 }
}

let previous=performance.now();
function frame(now){
 const dt=clamp((now-previous)/1000,0,.05);previous=now;
 if(smith)drawSmith(dt);
 if(chestScene)animateChest(dt);
 if(el('gear').open||el('rewards').open){requestAnimationFrame(frame);return}
 const height=Math.round(W*view.clientHeight/Math.max(1,view.clientWidth));
 if(height!==H){H=height;view.height=H*2}
 g.setTransform(2,0,0,2,0,0);g.imageSmoothingEnabled=false;
 let dx=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
 let dy=(keys.has('ArrowDown')||keys.has('KeyS')?1:0)-(keys.has('ArrowUp')||keys.has('KeyW')?1:0);
 if(stick){dx+=stick.dx/24;dy+=stick.dy/24}
 const length=Math.hypot(dx,dy);
 if(length>.12){
  const speed=(wearing('boots')?92:76)*dt/Math.max(1,length);
  player.x=clamp(player.x+dx*speed,10,world-10);player.y=clamp(player.y+dy*speed,16,world-10);
  if(Math.abs(dx)>.15)player.dir=Math.sign(dx);
  player.walk+=dt;
  if(Math.floor(player.walk*2)!==Math.floor((player.walk-dt)*2))exposeVeins();
  movementHudTimer+=dt;
  if(movementHudTimer>=.10){movementHudTimer=0;update()}
 }
 if(wave&&(wave.age+=dt)>=.30)wave=null;
 if(combo&&(combo.age+=dt)>=1)combo=null;
 if(boss){
  const distance=dist(player,boss);
  if(distance>23&&distance<140){boss.x+=(player.x-boss.x)*dt*13/distance;boss.y+=(player.y-boss.y)*dt*13/distance}
  boss.recoil=Math.max(0,(boss.recoil??0)-dt);
  if(distance>0&&distance<19&&boss.recoil===0){
   player.x=clamp(player.x+(player.x-boss.x)*18/distance,10,world-10);
   player.y=clamp(player.y+(player.y-boss.y)*18/distance,16,world-10);
   boss.recoil=1.3;
  }
 }
 cooldown-=dt;swing=Math.max(0,swing-dt);flash=Math.max(0,flash-dt);
 if(holding||keys.has('Space'))strike();
 drillTimer+=dt;
 if(drill&&drillTimer>.85){drillTimer=0;mine(false)}
 let collected=false;
 loot=loot.filter(gem=>{
  gem.age+=dt;if(gem.age<0)return true;
  if(gem.age<.22){gem.x+=gem.dx*dt;gem.y+=gem.dy*dt;return true}
  const d=dist(player,gem);
  if(d<5){bag[gem.type]++;if(wearing('magnet'))magnetCharge++;collected=true;return false}
  if(d<(wearing('magnet')?125+8*((rank.magnet??1)-1):90)){const step=Math.min(d,dt*(95+gem.age*42));gem.x+=(player.x-gem.x)*step/d;gem.y+=(player.y-gem.y)*step/d}
  return true;
 });
 if(collected)update();
 tickSkills(dt);
 dust=dust.filter(p=>{p.age+=dt;if(p.age>=0){p.x+=p.dx*dt;p.y+=p.dy*dt;p.dy+=155*dt}return p.age<.34});
 saveTimer+=dt;if(saveTimer>4){saveTimer=0;save()}
 render(dt);requestAnimationFrame(frame);
}
exposeVeins();update();
if(idleCount){note('방치 채굴 · 광석 '+idleCount+'개 · +'+idleCount+' XP');save()}
requestAnimationFrame(frame);
</script></html>
